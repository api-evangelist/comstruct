name: Comstruct
description: 'Comstruct is a Munich-based construction technology company that provides AI-powered
  agents to automate the procurement of construction materials. Its platform runs the full procurement
  workflow from the bill of materials (Leistungsverzeichnis) through supplier inquiry, offer comparison,
  contract negotiation, digital delivery notes, AI-based invoice verification, and sustainability
  reporting. Customers include HOCHTIEF, Implenia, Marti, and Leonhard Weiss. Comstruct is backed by
  GV (Google Ventures). As of enrichment the company publishes no public developer portal, API
  reference, or OpenAPI definition; this profile is maintained in the API Evangelist network from its
  public web presence.'
